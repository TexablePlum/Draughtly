# Draughtly local infrastructure.
# All credentials below are development-only and MUST NOT be used in production.

services:
  postgres:
    image: postgres:17-alpine
    container_name: draughtly-postgres
    environment:
      POSTGRES_DB: user_service
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: user_service
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service -d user_service"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: draughtly-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: draughtly-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: draughtly
      RABBITMQ_DEFAULT_PASS: draughtly
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: draughtly-user-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      USER_SERVICE_DB_URL: jdbc:postgresql://postgres:5432/user_service
      USER_SERVICE_DB_USERNAME: user_service
      USER_SERVICE_DB_PASSWORD: user_service
      USER_SERVICE_REDIS_HOST: redis
      USER_SERVICE_REDIS_PORT: 6379
      USER_SERVICE_RABBITMQ_HOST: rabbitmq
      USER_SERVICE_RABBITMQ_PORT: 5672
      USER_SERVICE_RABBITMQ_USERNAME: draughtly
      USER_SERVICE_RABBITMQ_PASSWORD: draughtly
      USER_SERVICE_JWT_SECRET: local-dev-signing-secret-not-for-production
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
