spring:
  application:
    name: user-service

  datasource:
    url: ${USER_SERVICE_DB_URL:jdbc:postgresql://localhost:5432/user_service}
    username: ${USER_SERVICE_DB_USERNAME:user_service}
    password: ${USER_SERVICE_DB_PASSWORD:user_service}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${USER_SERVICE_REDIS_HOST:localhost}
      port: ${USER_SERVICE_REDIS_PORT:6379}
      password: ${USER_SERVICE_REDIS_PASSWORD:}

  rabbitmq:
    host: ${USER_SERVICE_RABBITMQ_HOST:localhost}
    port: ${USER_SERVICE_RABBITMQ_PORT:5672}
    username: ${USER_SERVICE_RABBITMQ_USERNAME:guest}
    password: ${USER_SERVICE_RABBITMQ_PASSWORD:guest}

security:
  jwt:
    secret: ${USER_SERVICE_JWT_SECRET:}

server:
  port: ${USER_SERVICE_HTTP_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
